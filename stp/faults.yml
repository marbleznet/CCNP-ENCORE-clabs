# =============================================================================
#  SPANNING TREE (RSTP / MST / guards) fault catalogue — used by ../tools/labctl.py
# =============================================================================
#  Assumes the KNOWN-GOOD baseline is loaded (`labctl.py stp baseline`):
#
#    MST region "ENCOR", revision 1, on ALL FOUR switches:
#        instance 1 -> VLAN 10      instance 2 -> VLAN 20
#        instance 0 (IST) -> everything else
#    Root placement:
#        SW1  mst 0-1 priority 4096   (IST + MSTI1 root)   mst 2 priority 8192
#        SW2  mst 0-1 priority 8192   (IST + MSTI1 backup)
#        SW3  mst 2   priority 4096   (MSTI2 root)
#        SW4  no priority anywhere    (must never be root)
#    Guards:
#        SW2 E0/3, SW3 E0/3  -> spanning-tree guard root   (downlinks to SW4)
#        SW4 E0/1, E0/2      -> spanning-tree guard loop   (its two uplinks)
#        All access ports    -> portfast + bpduguard
#    Trunks everywhere, native VLAN 99, allowed 10,20,99.
#    host-a 10.10.10.11 (SW4, V10)   host-b 10.10.10.12 (SW1, V10)
#    host-c 10.10.20.13 (SW4, V20)   host-d 10.10.20.14 (SW1, V20)
#
#  What "healthy" looks like (memorise this before you break anything):
#    sw4# show spanning-tree mst 1     -> Et0/1 Root FWD, Et0/2 Altn BLK
#    sw4# show spanning-tree mst 2     -> Et0/1 Altn BLK, Et0/2 Root FWD
#      ^^ THE KEY FACT. SW4 reaches VLAN 10 over Et0/1 (via SW2) and VLAN 20
#         over Et0/2 (via SW3). The two instances use DIFFERENT uplinks -- that
#         is MST load balancing, and most faults here show up as that split
#         collapsing onto one uplink.
#    sw1# show spanning-tree mst 0     -> "Root  this switch for the CIST"
#    sw3# show spanning-tree mst 2     -> all ports Desg FWD (it is the root)
#    NO port anywhere shows BKN or an *_Inc flag.
#    host-a -> host-b PINGS (VLAN 10).  host-c -> host-d PINGS (VLAN 20).
#    Cross-VLAN (host-a -> host-d) does NOT ping: there is no router in this lab.
#
#  Convergence (measured on this topology, IOS-XE 17.16):
#    RSTP/MST re-convergence after a priority or cost change   ~3-15s
#    Guard trip (root / loop inconsistent)                     ~3-10s
#    Guard RECOVERY after the cause is removed                 up to ~35s
#    BPDU-starvation faults need a full max-age (20s) before the receiving
#    port gives up on its stored BPDU -- allow 45s.
#    Allow 45s after a break and 45s after a fix.
#
#  ⚠ Six verification traps in this topology, every one of which produced a
#    FALSE result at least once while this catalogue was being built:
#    * `show spanning-tree` with no instance shows the CIST (instance 0) ONLY.
#      Most faults here live in MSTI 1 or MSTI 2 and are INVISIBLE in it. Always
#      say which instance: `show spanning-tree mst 1`.
#    * A blocked port is not always a fault, and a fault does not always block.
#      In a healthy baseline SW4 and SW3 each have an Altn BLK port PER
#      INSTANCE. Compare against the healthy output above, not against "is
#      anything blocking".
#    * Ping is a poor STP test. Most of these faults REROUTE rather than
#      disconnect -- the path gets worse, the topology gets wrong, and every
#      ping still succeeds. Read port ROLES, not reachability.
#    * A guard that has tripped shows as `BKN` with a `*ROOT_Inc` or `*LOOP_Inc`
#      marker in the Type column, NOT as "down" and NOT in `show interfaces`.
#      `show spanning-tree inconsistentports` is the direct check.
#    * IOL reports ports with NO CABLE as "connected" in `show interfaces
#      status`. Never use that to infer topology; use `show cdp neighbors`.
#    * Root guard and loop guard are configured per PORT but act per INSTANCE.
#      A port can be root-inconsistent for MSTI1 and forwarding for MSTI2 at the
#      same time. Check both instances before concluding a guard "did nothing".
#    * A port holds exactly ONE guard. `spanning-tree guard` has three values
#      (root / loop / none), so setting `guard root` on a port that had
#      `guard loop` REPLACES it, and `no spanning-tree guard root` leaves it
#      with NO guard. Verify with `show run interface <if> | include guard`.
#    * A command that is ACCEPTED is not necessarily a command that is IN
#      EFFECT. `spanning-tree portfast` on a trunk port warns and does nothing
#      (and BPDU guard then never fires); `mac access-group` installs and
#      filters nothing at all. Confirm with the feature's own show command --
#      `show spanning-tree interface <if> portfast`, or a hit counter.
#
#  Add your own: copy an entry, give it a unique id. Keep `fix` an exact
#  inverse (and if it genuinely cannot be, say so in `explain`).
# =============================================================================
faults:

  # ------------------------------------------------- root bridge placement
  - id: root-priority-cleared
    name: "SW1 loses its root priority for the IST and MSTI1"
    topic: "3.1.c"
    difficulty: easy
    symptom: "Everything still pings, but the VLAN 10 tree has re-rooted: SW1 is
              no longer the root bridge and traffic now converges on SW2
              instead. Nobody reported an outage."
    hint: "Nothing is blocked that shouldn't be and nothing is down. Ask which
           switch is root now, and what decides that when nobody has configured
           a priority."
    explain: "Root bridge election compares the Bridge ID: PRIORITY first, then
              MAC address as the tiebreak. Removing SW1's `spanning-tree mst 0-1
              priority 4096` leaves SW2's 8192 as the lowest configured value,
              so SW2 wins and the whole VLAN 10 / IST topology re-converges
              around it. Two lessons. First, **root placement is something you
              configure, not something that happens** -- with no priorities at
              all the winner is simply the lowest MAC address, which usually
              means the oldest switch in the building becomes the root of your
              network. Second, this fault causes no outage whatsoever: STP
              re-converges cleanly and every host still pings. It is a design
              regression, not a failure, and the only way to notice it is to
              check who the root actually is against who it is supposed to be."
    find: "`show spanning-tree mst 0` on any switch -- the Root ID priority and
           address are now SW2's, and SW1 no longer prints 'Root  this switch
           for the CIST'. `show spanning-tree mst 1` on SW1 shows it has a Root
           port where it used to have only Designated ports."
    break:
      - node: sw1
        lines: ["no spanning-tree mst 0-1 priority 4096"]
    fix:
      - node: sw1
        lines: ["spanning-tree mst 0-1 priority 4096"]

  - id: root-hijack-blocked-by-rootguard
    name: "SW4 claims the MSTI1 root and root guard shuts it out"
    topic: "3.1.c"
    difficulty: med
    symptom: "host-a has lost host-b -- VLAN 10 is down between the access
              switch and the rest of the network. VLAN 20 is completely
              unaffected and host-c still reaches host-d. No interface is down
              and no cable was touched."
    hint: "One VLAN died and the other did not, so look at the instances
           separately. Then look at the Type column on SW4's uplinks, not the
           Status column."
    explain: "SW4 was given `spanning-tree mst 1 priority 0`, the best possible
              value, so it starts advertising itself as the MSTI1 root. SW2 and
              SW3 have `spanning-tree guard root` on their downlinks to SW4,
              and root guard's rule is: **if a SUPERIOR BPDU arrives on this
              port, do not re-root the network -- block the port instead.** Both
              downlinks go root-inconsistent, SW4 is cut off for MSTI1, and
              VLAN 10 dies behind it.
              This is root guard working exactly as designed, and it is worth
              being clear that the outage is the FEATURE: the alternative is an
              access switch becoming the root of your campus and every
              distribution path hairpinning through it. Compare with
              `rootguard-disabled-then-hijack`, which is the same provocation
              with the guard removed.
              **Verified on IOS-XE 17.16:** the guard acts PER INSTANCE. SW4
              only advertised a superior BPDU for MSTI1, so only MSTI1 goes
              root-inconsistent -- MSTI2 keeps forwarding over the very same
              physical ports, which is why VLAN 20 is untouched. A port is not
              simply 'blocked'; it is blocked for one instance."
    find: "`show spanning-tree inconsistentports` on SW2 and SW3 lists E0/3 as
           root-inconsistent. `show spanning-tree mst 1` on SW3 shows
           `Et0/3  Desg BKN  ... *ROOT_Inc`, while `show spanning-tree mst 2`
           shows the same port forwarding. `show logging | include ROOTGUARD`
           has the block message."
    break:
      - node: sw4
        lines: ["spanning-tree mst 1 priority 0"]
    fix:
      - node: sw4
        lines: ["no spanning-tree mst 1 priority 0"]

  - id: rootguard-disabled-then-hijack
    name: "Root guard removed from the downlinks, then SW4 takes the root"
    topic: "3.1.c"
    difficulty: hard
    symptom: "Nothing is blocked, nothing is inconsistent, every host pings, and
              every guard check comes back clean. But the access switch SW4 is
              now the root bridge for VLAN 10, and traffic between the
              distribution switches is hairpinning down through it."
    hint: "This one has no error state at all to find -- STP is working
           perfectly, on a topology you did not intend. Ask what the tree is
           supposed to look like before asking what is wrong with it."
    explain: "This is the counterfactual to `root-hijack-blocked-by-rootguard`:
              the same superior BPDU from SW4, but with the guard removed from
              SW2 and SW3 first. Now nothing stops it. SW4 becomes the MSTI1
              root, and every VLAN 10 path between SW1, SW2 and SW3 is
              recomputed to run THROUGH the access switch -- typically the
              smallest, cheapest, most heavily loaded box in the design, quite
              possibly connected on slower links.
              **This is the single most important STP failure mode to
              understand**, and the reason is in the symptom: there is no
              error. No port is blocked that shouldn't be, no log message fires,
              no guard trips, and every ping succeeds. A pure `show
              spanning-tree inconsistentports`-style sweep finds nothing. The
              only way to detect it is to know which switch is SUPPOSED to be
              root and check. That is why root guard exists on every downlink
              and why root placement is explicitly configured -- the failure is
              silent by nature."
    find: "`show spanning-tree mst 1` on SW1/SW2/SW3 -- the Root ID is now SW4's
           bridge address and each has a Root port pointing DOWN toward SW4.
           Compare with the baseline, where SW1 prints 'This bridge is the
           root'. `show spanning-tree mst 1 | include Root ID` on all four is
           the fastest sweep."
    break:
      - node: sw2
        lines: ["interface Ethernet0/3", " no spanning-tree guard root"]
      - node: sw3
        lines: ["interface Ethernet0/3", " no spanning-tree guard root"]
      - node: sw4
        lines: ["spanning-tree mst 1 priority 0"]
    fix:
      - node: sw4
        lines: ["no spanning-tree mst 1 priority 0"]
      - node: sw2
        lines: ["interface Ethernet0/3", " spanning-tree guard root"]
      - node: sw3
        lines: ["interface Ethernet0/3", " spanning-tree guard root"]

  - id: rootguard-on-uplink-port
    name: "Root guard applied to an UPLINK instead of a downlink"
    topic: "3.1.c"
    difficulty: hard
    symptom: "VLAN 10 still works, but SW4 now reaches it the long way round --
              via SW3 instead of its direct link to SW2 -- and SW4's E0/1 is
              blocked with an inconsistency flag. Nobody changed a priority or a
              cost, and the port and cable are fine."
    hint: "Read what root guard actually promises, then ask what that means for
           a port that is SUPPOSED to hear the best BPDU on the network."
    explain: "Root guard blocks a port when a SUPERIOR BPDU arrives on it. On a
              downlink that is protection -- nothing below you should ever be
              better than the root. On an UPLINK it is self-sabotage: SW4's
              E0/1 faces SW2, which is on the path to the real root SW1, so the
              superior BPDUs arriving there are entirely legitimate. Root guard
              cannot tell the difference between a rogue and the genuine root;
              it only knows 'better than what I currently have'. The port trips
              to root-inconsistent immediately.
              The recovery behaviour is worth noting too: root-inconsistent is
              **self-clearing**, unlike BPDU guard's err-disable. Remove the
              guard (or stop the superior BPDUs) and the port returns to normal
              on its own within a few tens of seconds -- no `shutdown` /
              `no shutdown` needed.
              The rule to memorise: **root guard points DOWN, loop guard points
              UP.** Root guard on ports facing away from the root, loop guard on
              root and alternate ports facing toward it. Getting them the wrong
              way round breaks the network in exactly this way.
              ⚠ **A port holds exactly ONE guard setting, and this fault is how
              that was discovered here. Verified on IOS-XE 17.16:** the
              baseline has `spanning-tree guard loop` on this port; applying
              `spanning-tree guard root` **silently replaces it** (the running
              config shows only `guard root`), and `no spanning-tree guard root`
              then leaves the port with **no guard at all** rather than
              restoring loop guard. `spanning-tree guard` is a single setting
              with three values -- root, loop, none -- not two independent
              toggles.
              That is why this fault's `fix` explicitly re-applies
              `spanning-tree guard loop` instead of negating the root guard: the
              obvious inverse looked correct, left the port unprotected, and
              silently invalidated three LATER faults in this catalogue that
              depend on loop guard being present on that port. If you write your
              own guard faults, restore the guard you displaced -- and in
              production, remember that adding root guard to a port that already
              had loop guard removes the loop protection you thought you had."
    find: "`show spanning-tree inconsistentports` on SW4 lists E0/1.
           `show spanning-tree mst 1` shows `Et0/1 Desg BKN ... *ROOT_Inc` and
           the Root port has moved to Et0/2. `show run interface Ethernet0/1`
           shows `spanning-tree guard root` on a port whose description says
           uplink."
    break:
      - node: sw4
        lines: ["interface Ethernet0/1", " spanning-tree guard root"]
    fix:
      # NOT `no spanning-tree guard root` -- see `explain`. A port holds exactly
      # ONE guard setting, so `guard root` OVERWROTE the baseline's `guard loop`
      # and `no guard root` would leave the port with NO guard at all, silently
      # degrading the baseline for every fault run afterwards. Restore the loop
      # guard explicitly.
      - node: sw4
        lines: ["interface Ethernet0/1", " spanning-tree guard loop"]

  # ----------------------------------------------------- MST region / instances
  - id: mst-revision-mismatch
    name: "SW3's MST revision number changed"
    topic: "3.1.c"
    difficulty: hard
    symptom: "The VLAN 20 tree has re-rooted away from SW3 and the topology
              around SW3 has changed shape. SW3's region name is still ENCOR,
              its instance-to-VLAN mapping is still correct, and every trunk and
              VLAN is exactly as it should be."
    hint: "The region name matches and the VLAN mapping matches. What ELSE is
           part of a region's identity -- and how do neighbours actually compare
           it, given they never exchange the mapping itself?"
    explain: "An MST region is defined by THREE things that must match exactly:
              the **name**, the **revision number**, and the **complete
              VLAN-to-instance map**. Those are hashed into a 16-byte
              **configuration digest** carried in every MST BPDU; neighbours
              compare digests, never the underlying config. Change any one
              input -- here just the revision, from 1 to 2 -- and the digest
              changes completely, so SW3 is no longer in the same region as
              everyone else.
              The consequence is not an outage but a demotion: the links to SW3
              become **boundary** links. Across a boundary, all the internal
              MSTIs are collapsed and only the CIST is presented, so SW3 can no
              longer be the MSTI2 root for the rest of the region and VLAN 20
              re-roots elsewhere. The revision number is the classic version of
              this because it looks like documentation rather than
              configuration -- people copy a region block between switches,
              carefully match the name, and never think about the number
              underneath it. It is also why you must never treat the revision
              as a comment: bump it deliberately and everywhere, or not at all."
    find: "`show spanning-tree mst configuration digest` on SW3 versus any other
           switch -- the Digest values differ. `show spanning-tree mst
           configuration` shows Revision 2 on SW3 and 1 elsewhere. `show
           spanning-tree mst 2` on SW1 shows IT has taken over as MSTI2 root.
           ⚠ Do NOT judge this from SW3 itself: with a mismatched digest SW3
           becomes a REGION OF ONE, so it still reports 'this switch' as the
           MSTI2 root -- and it is correct, for its own private region. The
           change is only visible from the other three switches. Checking the
           wrong end here produced a false negative while this catalogue was
           being verified."
    break:
      - node: sw3
        lines: ["spanning-tree mst configuration", " revision 2", "exit"]
    fix:
      - node: sw3
        lines: ["spanning-tree mst configuration", " revision 1", "exit"]

  - id: vlan20-remapped-to-msti1
    name: "VLAN 20 moved into MSTI1 on every switch"
    topic: "3.1.c"
    difficulty: med
    symptom: "Everything pings and no port is blocked unexpectedly, but SW4 now
              carries BOTH VLANs over its E0/1 uplink and E0/2 is blocking for
              everything. The VLAN 20 load-balancing path through SW3 is gone.
              All four switches still agree with each other -- there is no
              region mismatch."
    hint: "The region is consistent, so this is not a boundary problem. Ask
           which instance VLAN 20 is in now, and which switch is the root of
           THAT instance."
    explain: "The change was applied to all four switches, so the digests still
              match and the region is intact -- this is a *design* fault, not a
              *consistency* fault, which makes it quite different from
              `mst-revision-mismatch` despite touching the same config block.
              VLAN 20 now belongs to MSTI1, whose root is SW1, so it follows
              exactly the same tree as VLAN 10 and SW4's E0/2 uplink goes
              Alternate for every instance. Half the available bandwidth out of
              the access switch is now idle.
              The lesson is what MST instances are FOR. Instances are not
              administrative grouping for tidiness -- each one is a separate
              tree with its own root, and the reason to have more than one is to
              point different VLANs down different physical paths. Collapsing
              two instances into one is legal, silent, and throws away the load
              balancing you built the second instance to get. Note also that
              MSTI2 still exists and is still rooted at SW3; it just has no
              VLANs in it, which is why nothing looks broken anywhere."
    find: "`show spanning-tree mst configuration` on any switch -- instance 1
           now maps '10,20' and instance 2 maps nothing. `show spanning-tree
           mst 2` has no VLANs listed against it. `show spanning-tree mst 1` on
           SW4 shows both uplinks, with Et0/2 Alternate -- and there is no
           longer any instance in which Et0/2 forwards."
    break:
      - node: sw1
        lines: ["spanning-tree mst configuration", " instance 1 vlan 10,20", "exit"]
      - node: sw2
        lines: ["spanning-tree mst configuration", " instance 1 vlan 10,20", "exit"]
      - node: sw3
        lines: ["spanning-tree mst configuration", " instance 1 vlan 10,20", "exit"]
      - node: sw4
        lines: ["spanning-tree mst configuration", " instance 1 vlan 10,20", "exit"]
    fix:
      - node: sw1
        lines: ["spanning-tree mst configuration", " instance 1 vlan 10",
                " instance 2 vlan 20", "exit"]
      - node: sw2
        lines: ["spanning-tree mst configuration", " instance 1 vlan 10",
                " instance 2 vlan 20", "exit"]
      - node: sw3
        lines: ["spanning-tree mst configuration", " instance 1 vlan 10",
                " instance 2 vlan 20", "exit"]
      - node: sw4
        lines: ["spanning-tree mst configuration", " instance 1 vlan 10",
                " instance 2 vlan 20", "exit"]

  - id: msti2-root-lost
    name: "SW3 loses its MSTI2 root priority"
    topic: "3.1.c"
    difficulty: easy
    symptom: "Everything pings, but VLAN 20 no longer takes its own path: SW4
              now reaches both VLANs over E0/1 and its E0/2 uplink is blocking
              for both instances. The MST region and VLAN mapping are correct
              and unchanged."
    hint: "Both instances now agree on the tree. Which switch is the root of
           instance 2, and which one is supposed to be?"
    explain: "Removing SW3's `spanning-tree mst 2 priority 4096` hands the MSTI2
              root to the next-best candidate, which is SW1 at 8192 (configured
              as the deliberate backup). MSTI2 now roots in the same place as
              MSTI1, so both instances compute the same tree and SW4's second
              uplink is Alternate for everything.
              This is the *load-balancing regression* form of a root problem and
              is worth contrasting with `vlan20-remapped-to-msti1`, which
              produces an almost identical symptom by a completely different
              route -- one moves the VLAN out of the instance, the other moves
              the root out of the switch. Being able to tell those apart from
              the same starting symptom is the skill: check the VLAN-to-instance
              map first (`show spanning-tree mst configuration`), then the root
              per instance (`show spanning-tree mst 2`). Note also that the
              backup priority did its job -- because SW1 was configured at 8192
              for MSTI2, the root landed somewhere predictable instead of on
              whichever switch happened to have the lowest MAC."
    find: "`show spanning-tree mst 2` -- the Root ID is now SW1's, and SW3 no
           longer says 'This bridge is the root'. `show run | include mst 2` on
           SW3 has no priority line. Compare `show spanning-tree mst 1` and
           `mst 2` on SW4: identical port roles, where the baseline had them
           mirrored."
    break:
      - node: sw3
        lines: ["no spanning-tree mst 2 priority 4096"]
    fix:
      - node: sw3
        lines: ["spanning-tree mst 2 priority 4096"]

  - id: mst-max-hops-too-low
    name: "MST max-hops reduced to 1 at the root"
    topic: "3.1.c"
    difficulty: med
    symptom: "SW4 is completely isolated -- both VLANs are down behind it and
              BOTH of its uplinks are blocked with an inconsistency flag. The
              distribution switches are all healthy and still reach each other
              normally. SW4 itself believes it is the root bridge."
    hint: "SW4 has stopped hearing the root altogether, on both uplinks at once,
           without either link going down. What limits how far a BPDU travels
           inside an MST region -- and what does the port that stops hearing
           BPDUs do about it?"
    explain: "Inside an MST region, BPDU age is not tracked with max-age the way
              classic STP does it. The region uses a **hop count**: the root
              sends BPDUs with a hop count of `max-hops` (default 20) and every
              switch decrements it before passing it on. At zero the BPDU is
              discarded. Setting `spanning-tree mst max-hops 1` on the root
              means SW2 and SW3 (one hop) still hear it, but SW4 (two hops)
              never does -- so from SW4's point of view there is no root at all
              and it elects **itself**.
              That should be a catastrophe. A switch that thinks it is root puts
              every port into Designated/Forwarding, and SW4 forwarding on both
              uplinks would bridge SW2 to SW3 through it -- a genuine layer-2
              loop with no TTL to limit the resulting broadcast storm.
              **Verified on IOS-XE 17.16: it does not happen, because loop guard
              catches it.** SW4's uplinks are non-designated ports that suddenly
              stopped receiving BPDUs, which is precisely loop guard's trigger,
              so both go `*LOOP_Inc` instead of forwarding. The lab loses
              connectivity to SW4 and stays stable. This fault is the best
              demonstration in the catalogue of *why* loop guard is worth
              configuring: the failure mode it converts is an outage instead of
              a storm, and an outage is enormously preferable.
              Practical note: max-hops effectively sets the region's diameter,
              so it must exceed the number of switches between the root and the
              furthest switch in the region."
    find: "`show spanning-tree mst 0` on SW4 -- it claims 'Root  this switch for
           the CIST', which on an access switch is immediately wrong. `show
           spanning-tree inconsistentports` lists both uplinks as
           loop-inconsistent. `show spanning-tree mst | include hops` on SW1
           shows the reduced value; the default is 20."
    break:
      - node: sw1
        lines: ["spanning-tree mst max-hops 1"]
    fix:
      - node: sw1
        lines: ["spanning-tree mst max-hops 20"]

  # -------------------------------------------------------- path manipulation
  - id: mst-cost-manipulation
    name: "MSTI1 port cost raised on SW4's primary uplink"
    topic: "3.1.c"
    difficulty: med
    symptom: "Everything pings. VLAN 10 out of SW4 has silently moved from the
              E0/1 uplink to E0/2, so it now shares a path with VLAN 20 and the
              direct link to SW2 sits idle for that instance. No priority
              changed and no guard tripped."
    hint: "Root selection is unchanged -- SW1 is still the root. So this is not
           about WHO the root is, it is about how SW4 decides which way to
           reach it. What is the first tiebreaker in that decision?"
    explain: "A switch picks its root port by lowest **root path cost** -- the
              running total of the cost of each link back to the root -- long
              before priorities or bridge IDs are consulted. Raising the MSTI1
              cost on E0/1 makes the path through SW2 more expensive than the
              path through SW3, so SW4 moves its MSTI1 root port to E0/2 and the
              old one goes Alternate.
              Two things worth carrying away. First, **cost is per instance**:
              `spanning-tree mst 1 cost` affects only MSTI1, which is why VLAN
              20 does not move and why a cost fault can look like it affects
              'only some VLANs'. Second, **cost is directional and local** --
              it is the cost of the port a switch RECEIVES the root's BPDU on,
              evaluated by that switch. Setting the cost on the far end (SW2's
              E0/3) would change how SW2 computes ITS tree, not how SW4 chooses
              its uplink. Getting the end wrong is the usual reason a cost
              change appears to do nothing.
              **Verified on IOS-XE 17.16**: the default cost on these 10 Mb IOL
              interfaces is 2000000 (long path-cost method), not the classic
              short-method 100, so a fault value has to be well above 2000000
              to have any effect at all."
    find: "`show spanning-tree mst 1` on SW4 -- Et0/2 is now Root FWD and Et0/1
           is Altn BLK, the mirror of the baseline. The Cost column on Et0/1
           reads the inflated value. `show spanning-tree mst 2` is unchanged,
           which localises it to one instance."
    break:
      - node: sw4
        lines: ["interface Ethernet0/1", " spanning-tree mst 1 cost 20000000"]
    fix:
      - node: sw4
        lines: ["interface Ethernet0/1", " no spanning-tree mst 1 cost"]

  - id: stp-mode-mismatch
    name: "SW4 switched from MST to rapid-PVST"
    topic: "3.1.c"
    difficulty: med
    symptom: "SW4 no longer participates in the MST region. Its uplinks behave
              oddly and the per-instance load balancing out of the access switch
              has gone. Every VLAN, trunk and cable is correct."
    hint: "Compare the one thing every other check assumes is the same on all
           four switches. `show spanning-tree summary` on each, first line."
    explain: "MST and rapid-PVST are different protocols with different BPDU
              formats. Where they meet, the MST switch treats the link as a
              **boundary** and runs PVST simulation: it presents only the CIST
              to the PVST neighbour and maps it onto that neighbour's per-VLAN
              trees. The internal MSTIs are not visible across the boundary at
              all, so the deliberate VLAN 10 / VLAN 20 path split collapses.
              The reason this belongs in a troubleshooting catalogue is that
              `spanning-tree mode` is a single global line that nothing else
              references, so it is easy to miss when comparing configs -- every
              per-VLAN and per-instance command on the switch can be correct
              while the mode underneath them is wrong. It is also a genuine
              migration hazard: converting a campus from PVST to MST switch by
              switch means running exactly this boundary condition, deliberately
              and temporarily, which is why the migration order (start at the
              edge, finish at the root, or the reverse) matters.
              Watch for `%SPANTREE-2-PVSTSIM_FAIL` in the log: if the boundary
              cannot be simulated consistently the MST switch blocks the port
              outright rather than risk a loop."
    find: "`show spanning-tree summary | include mode` on all four switches --
           SW4 says 'rapid-pvst', everyone else says 'mst'. On SW2/SW3 the ports
           to SW4 show as boundary in `show spanning-tree mst 0`. `show
           spanning-tree mst configuration` on SW4 errors or shows the config is
           no longer in effect."
    break:
      - node: sw4
        lines: ["spanning-tree mode rapid-pvst"]
    fix:
      - node: sw4
        lines: ["spanning-tree mode mst"]

  # --------------------------------------------------------- guards and filters
  - id: bpduguard-on-uplink
    name: "PortFast + BPDU guard applied to a switch-to-switch uplink"
    topic: "3.1.c"
    difficulty: med
    symptom: "The link between SW3 and SW4 is DOWN -- genuinely down, showing
              err-disabled on SW3 -- moments after it was reconfigured. Nothing
              was unplugged. VLAN 20 has rerouted the long way round and still
              works."
    hint: "The switch disabled the port itself. Which feature is designed to do
           exactly that, and what does it consider an unforgivable event on a
           port it believes faces a host?"
    explain: "PortFast declares 'this port faces an end host, so skip the
              listening/learning delay', and BPDU guard adds 'and if a BPDU ever
              arrives here, I was lied to -- shut the port down'. Applied to an
              access port that is the correct and inseparable pairing. Applied
              to a port facing another SWITCH, the neighbour's very first BPDU
              -- arriving within 2 seconds -- trips it into **err-disabled**.
              This is a common real-world outage: an access-port template gets
              pasted onto an uplink during a change, and the link dies instantly
              rather than subtly.
              ⚠ **This fault had to be corrected, and the correction is the most
              useful thing in it. Verified on IOS-XE 17.16: plain
              `spanning-tree portfast` on a TRUNK port does nothing at all.**
              IOS accepts it and prints a warning that is easy to scroll past --
              'Portfast has been configured on Ethernet0/3 but will only have
              effect when the interface is in a non-trunking mode' -- and
              `show spanning-tree interface Ethernet0/3 portfast` then reports
              `disabled` for every instance. Critically, **BPDU guard did not
              fire either**, even though `spanning-tree bpduguard enable` was
              configured on the interface and BPDUs were arriving every two
              seconds: on this platform the interface-level guard only acts on a
              port where PortFast is OPERATIONAL. The fault only fires with
              `spanning-tree portfast trunk`, the explicit trunk-mode form.
              Two lessons worth more than the fault itself: a configuration line
              that is accepted is not necessarily a line that is in effect, and
              `show spanning-tree interface <if> portfast` is how you tell the
              difference.
              ⚠ **The `fix` for this fault is deliberately NOT an exact inverse
              of the `break`, and that asymmetry is the lesson.** err-disable is
              a LATCHED state: removing the PortFast and BPDU guard commands
              does not bring the port back, because nothing re-evaluates it. The
              fix must also bounce the interface with `shutdown` / `no
              shutdown`. The alternative in production is to configure
              `errdisable recovery cause bpduguard` in advance so the switch
              retries on a timer. Removing a cause does not undo an effect."
    find: "`show interfaces status | include err-disabled` on SW3 -- E0/3.
           `show interfaces Ethernet0/3 | include line protocol` confirms it is
           down. `show logging | include BPDUGUARD|PSECURE|err-disable` names
           BPDU guard as the cause, and `show errdisable recovery` shows whether
           anything will ever bring it back."
    break:
      # NOTE: it MUST be `portfast trunk`, not plain `portfast`. See `explain` --
      # plain `spanning-tree portfast` on a trunk port is accepted, warns, and
      # then does nothing, and BPDU guard never fires. That was the first
      # version of this fault and it silently no-opped.
      - node: sw3
        lines: ["interface Ethernet0/3", " spanning-tree portfast trunk",
                " spanning-tree bpduguard enable"]
    fix:
      - node: sw3
        lines: ["interface Ethernet0/3", " no spanning-tree bpduguard enable",
                " no spanning-tree portfast trunk",
                " shutdown", " no shutdown"]

  - id: loopguard-triggered-by-bpdufilter
    name: "BPDU filter on SW2's downlink starves SW4's uplink of BPDUs"
    topic: "3.1.c"
    difficulty: hard
    symptom: "VLAN 10 has rerouted out of SW4 via SW3 and its E0/1 uplink is
              blocked with an inconsistency flag -- but the link is UP, the
              cable is fine, both ends are configured as trunks, and SW2's end
              of it looks entirely normal and is still forwarding."
    hint: "One end of the link thinks everything is fine and the other has
           blocked it. Ask what SW4's port stopped RECEIVING, and which guard
           reacts to an absence rather than to an arrival."
    explain: "`spanning-tree bpdufilter enable` on an interface stops it both
              sending and processing BPDUs -- the port keeps forwarding data but
              becomes invisible to spanning tree. Applied to SW2's downlink, SW4
              stops hearing BPDUs on E0/1 entirely.
              Without protection that is how you get a broadcast storm: a
              non-designated port that stops receiving BPDUs ages out its stored
              information and transitions to FORWARDING, and if the link is
              still physically live in both directions you have just closed a
              loop. **Loop guard exists exactly for this** and makes the
              opposite bet from BPDU guard -- BPDU guard reacts to BPDUs
              APPEARING where they shouldn't, loop guard reacts to them
              DISAPPEARING where they should be. SW4's E0/1 goes
              `*LOOP_Inc` and stays blocked, and MSTI1 reroutes via SW3.
              The asymmetry in the symptom is the diagnostic signature and is
              worth internalising: **the switch showing the error is not the
              switch with the misconfiguration.** SW4 reports the inconsistency;
              SW2 holds the cause. Any fault where BPDUs go missing has this
              shape, including a genuine unidirectional fibre, which is the
              hardware failure loop guard and UDLD were both invented for."
    find: "`show spanning-tree inconsistentports` on SW4 lists E0/1 as
           loop-inconsistent. `show spanning-tree mst 1` on SW4 shows
           `*LOOP_Inc` in the Type column. Then look at the OTHER end: `show run
           interface Ethernet0/3` on SW2 has `spanning-tree bpdufilter enable`,
           and `show spanning-tree interface Ethernet0/3 detail` on SW2 shows
           its BPDU transmit counter static."
    break:
      - node: sw2
        lines: ["interface Ethernet0/3", " spanning-tree bpdufilter enable"]
    fix:
      - node: sw2
        lines: ["interface Ethernet0/3", " no spanning-tree bpdufilter enable"]

  - id: vacl-drops-vlan20
    name: "A VLAN access-map silently drops VLAN 20 traffic on SW4"
    topic: "5.2.a"
    difficulty: hard
    symptom: "host-c cannot reach host-d -- VLAN 20 is dead behind SW4. VLAN 10
              is completely unaffected. Every spanning-tree check passes: the
              region digest matches on all four switches, SW3 is still the MSTI2
              root, SW4's Et0/2 is still Root/Forwarding for MSTI2, and `show
              spanning-tree inconsistentports` reports ZERO."
    hint: "You have verified the layer-2 path is built correctly end to end, and
           it genuinely is. Stop asking whether the frames CAN cross and start
           asking whether something is choosing to discard them once they do."
    explain: "A VLAN access-map (VACL) filters traffic **within** a VLAN,
              including switched traffic that never touches a router. That makes
              it invisible to every spanning-tree, VLAN and trunk command you
              would normally reach for -- the tree is perfect, the port roles are
              exactly right, and the frames are dropped after arriving.
              This is the fault that justifies step 7 of the verification sweep.
              Steps 1-6 all pass, which is precisely the trap: a clean STP sweep
              proves the TOPOLOGY is right, not that traffic flows. The filter is
              also spread across three separate configuration blocks
              (`ip access-list`, `vlan access-map`, `vlan filter`), so a quick
              `show run | include` grep for one of them can easily miss it.
              `show vlan filter` is a one-line check and belongs in your standard
              L2 sweep.
              ⚠ **This fault replaced a MAC-ACL-based one, and the reason is a
              platform finding worth more than the original fault. Verified on
              IOS-XE 17.16: `mac access-group ... in` on an IOL switchport does
              NOT filter anything.** The intended fault denied the spanning-tree
              multicast destination 0180.c200.0000 to starve a port of BPDUs; the
              ACL installed cleanly, showed in the running-config, and had **zero
              hit counters** while `show spanning-tree interface Ethernet0/2
              detail` showed the BPDU receive counter still climbing. A
              subsequent test with a blunt `deny any any` MAC ACL on an access
              port did not stop ordinary host traffic either. So on this platform
              port MAC ACLs are accepted and inert, while VACLs work properly.
              Two things to take from that: **BPDUs are punted to the control
              plane and are not subject to port ACLs**, which is why you cannot
              filter spanning tree this way even where MAC ACLs do work; and a
              filter that shows no hit counters is telling you it is not being
              consulted, which is a diagnostic signal in its own right."
    find: "`show vlan filter` on SW4 -- 'VLAN Map DROP-SERVERS is filtering
           VLANs: 20'. Then `show vlan access-map DROP-SERVERS` shows the drop
           action and `show ip access-list MATCH-SERVERS` the matched subnet.
           Note that nothing in `show spanning-tree` anything, on any switch,
           gives the slightest hint."
    break:
      - node: sw4
        lines: ["ip access-list extended MATCH-SERVERS",
                " permit ip 10.10.20.0 0.0.0.255 any", "exit",
                "vlan access-map DROP-SERVERS 10",
                " match ip address MATCH-SERVERS", " action drop", "exit",
                "vlan access-map DROP-SERVERS 20", " action forward", "exit",
                "vlan filter DROP-SERVERS vlan-list 20"]
    fix:
      - node: sw4
        lines: ["no vlan filter DROP-SERVERS vlan-list 20",
                "no vlan access-map DROP-SERVERS 10",
                "no vlan access-map DROP-SERVERS 20",
                "no ip access-list extended MATCH-SERVERS"]
