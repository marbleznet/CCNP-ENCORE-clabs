! =====================================================================
!  SW3 — known-good baseline: MSTI2 (VLAN 20) root
!  Pasted ON TOP of the startup config (hostname/descriptions present).
! =====================================================================
!
vtp mode transparent
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name NATIVE-UNUSED
exit
!
! ---- MST region -- identical to every other switch ------------------
spanning-tree mode mst
spanning-tree mst configuration
 name ENCOR
 revision 1
 instance 1 vlan 10
 instance 2 vlan 20
exit
!
! ---- Root placement -------------------------------------------------
!  SW3 roots MSTI2 (VLAN 20) while SW1 roots MSTI1 (VLAN 10). This is
!  MST load balancing: the two VLANs take DIFFERENT paths through the
!  same physical topology, so both uplinks out of SW4 carry traffic
!  instead of one sitting idle.
spanning-tree mst 2 priority 4096
!
! ---- Trunks: triangle + downlink to SW4 -----------------------------
interface range Ethernet0/1 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
exit
!
! ---- Root guard on the DOWNLINK -------------------------------------
interface Ethernet0/3
 spanning-tree guard root
exit
!
end
