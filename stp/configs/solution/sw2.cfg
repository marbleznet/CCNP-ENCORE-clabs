! =====================================================================
!  SW2 — known-good baseline: IST + MSTI1 SECONDARY root
!  Pasted ON TOP of the startup config (hostname/descriptions present).
! =====================================================================
!
vtp mode transparent
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name NATIVE-UNUSED
exit
!
! ---- MST region -- identical to every other switch ------------------
spanning-tree mode mst
spanning-tree mst configuration
 name ENCOR
 revision 1
 instance 1 vlan 10
 instance 2 vlan 20
exit
!
! ---- Root placement -------------------------------------------------
!  Secondary for IST and MSTI1: takes over if SW1 fails, but never wins
!  while SW1 (4096) is present.
spanning-tree mst 0-1 priority 8192
!
! ---- Trunks: triangle + downlink to SW4 -----------------------------
interface range Ethernet0/1 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
exit
!
! ---- Root guard on the DOWNLINK -------------------------------------
!  E0/3 faces away from the root. Root guard says: if a superior BPDU
!  ever arrives here, do not re-root the network -- block the port
!  instead. It protects the root placement above from an access switch
!  (or anything plugged into one) claiming to be root.
!  Note it belongs on ports facing AWAY from the root. On a port facing
!  TOWARD the root it would block the moment the real root spoke.
interface Ethernet0/3
 spanning-tree guard root
exit
!
end
