! =====================================================================
!  SW4 — known-good baseline: access switch, dual-homed
!  Pasted ON TOP of the startup config (hostname/descriptions present).
! =====================================================================
!
vtp mode transparent
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name NATIVE-UNUSED
exit
!
! ---- MST region -- identical to every other switch ------------------
!  SW4 gets NO priority statement anywhere: it must never be root, and
!  the root guard on SW2/SW3 enforces that even if someone tries.
spanning-tree mode mst
spanning-tree mst configuration
 name ENCOR
 revision 1
 instance 1 vlan 10
 instance 2 vlan 20
exit
!
! ---- Uplink trunks --------------------------------------------------
interface range Ethernet0/1 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
exit
!
! ---- Loop guard on BOTH uplinks -------------------------------------
!  Exactly one uplink forwards per instance; the other is Alternate.
!  Loop guard protects the blocking one: if BPDUs stop arriving (a
!  unidirectional link, or somebody filtering them), the port would
!  normally age out its stored BPDU and start FORWARDING -- into a loop.
!  Loop guard puts it in loop-inconsistent instead. It is the safe
!  failure mode, and the opposite bet from BPDU guard: loop guard
!  reacts to BPDUs DISAPPEARING, BPDU guard to them APPEARING.
interface range Ethernet0/1 - 2
 spanning-tree guard loop
exit
!
! ---- Access ports ---------------------------------------------------
interface Ethernet0/3
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
exit
interface Ethernet1/0
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
exit
!
end
