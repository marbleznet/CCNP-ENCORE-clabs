! =====================================================================
!  SW1 — known-good baseline: IST (MST0) + MSTI1 root
!  Pasted ON TOP of the startup config (hostname/descriptions present).
! =====================================================================
!
vtp mode transparent
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name NATIVE-UNUSED
exit
!
! ---- MST region -----------------------------------------------------
!  A switch only joins a region if NAME, REVISION and the ENTIRE
!  VLAN-to-instance MAP all match. Those three are hashed into a digest
!  carried in the BPDU; any difference and the neighbour becomes a
!  BOUNDARY, not a region member. All four switches carry this block
!  byte-for-byte identically -- that is the point.
spanning-tree mode mst
spanning-tree mst configuration
 name ENCOR
 revision 1
 instance 1 vlan 10
 instance 2 vlan 20
exit
!
! ---- Root placement -------------------------------------------------
!  SW1 roots the IST (instance 0) and MSTI1 (VLAN 10).
!  SW3 roots MSTI2 (VLAN 20) -- see its config. SW1 is the BACKUP for
!  MSTI2 at 8192, so if SW3 dies the VLAN 20 tree lands here rather than
!  wherever the lowest MAC address happens to be.
spanning-tree mst 0-1 priority 4096
spanning-tree mst 2 priority 8192
!
! ---- Trunks to the distribution triangle ----------------------------
interface range Ethernet0/1 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
exit
!
! ---- Access ports ---------------------------------------------------
!  PortFast and BPDU guard belong together and should be applied as one
!  unit: PortFast says "this port faces a host, skip the delay", BPDU
!  guard says "and if I was wrong, shut it down rather than loop".
interface Ethernet0/3
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
exit
interface Ethernet1/0
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
exit
!
end
