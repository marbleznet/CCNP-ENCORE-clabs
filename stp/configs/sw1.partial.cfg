! =====================================================================
!  SW1  |  Distribution -- will become the IST (MST0) + MSTI1 ROOT
!
!  Minimal config only: hostname + interface descriptions.
!  NO VLANs, NO trunks, NO spanning-tree tuning, NO guards.
!  Every port boots as a DEFAULT ACCESS PORT IN VLAN 1 running the
!  default rapid-pvst. You build all of it yourself -- see README.md.
! =====================================================================
hostname sw1
!
no ip domain-lookup
!
! ---- Distribution triangle ------------------------------------------
!  You will trunk these and give SW1 the lowest priority so it wins the
!  root election for MST0 and MSTI1.
interface Ethernet0/1
 description ## to SW2 E0/1 -- trunk, distribution triangle ##
 no shutdown
!
interface Ethernet0/2
 description ## to SW3 E0/1 -- trunk, distribution triangle ##
 no shutdown
!
! ---- Access ports ---------------------------------------------------
!  Hosts cannot create a loop, so these become PortFast edge ports with
!  BPDU guard -- the pairing you should treat as inseparable.
interface Ethernet0/3
 description ## to host-b -- access VLAN 10, portfast + bpduguard ##
 no shutdown
!
interface Ethernet1/0
 description ## to host-d -- access VLAN 20, portfast + bpduguard ##
 no shutdown
!
end
