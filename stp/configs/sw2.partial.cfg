! =====================================================================
!  SW2  |  Distribution -- IST (MST0) + MSTI1 SECONDARY root
!
!  Minimal config only: hostname + interface descriptions.
!  NO VLANs, NO trunks, NO spanning-tree tuning, NO guards.
!  Every port boots as a DEFAULT ACCESS PORT IN VLAN 1.
!  You build all of it yourself -- see README.md.
! =====================================================================
hostname sw2
!
no ip domain-lookup
!
! ---- Distribution triangle ------------------------------------------
interface Ethernet0/1
 description ## to SW1 E0/1 -- trunk, distribution triangle ##
 no shutdown
!
interface Ethernet0/2
 description ## to SW3 E0/2 -- trunk, distribution triangle ##
 no shutdown
!
! ---- Downlink to the access switch ----------------------------------
!  This faces AWAY from the root, so it gets ROOT GUARD: SW4 must never
!  be allowed to become the root bridge, no matter what it advertises.
interface Ethernet0/3
 description ## to SW4 E0/1 -- trunk, downlink, ROOT GUARD ##
 no shutdown
!
end
