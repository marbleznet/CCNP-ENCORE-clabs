! =====================================================================
!  SW4  |  Access switch, dual-homed to SW2 and SW3
!
!  Minimal config only: hostname + interface descriptions.
!  NO VLANs, NO trunks, NO spanning-tree tuning, NO guards.
!  Every port boots as a DEFAULT ACCESS PORT IN VLAN 1.
!  You build all of it yourself -- see README.md.
! =====================================================================
hostname sw4
!
no ip domain-lookup
!
! ---- Dual uplinks ---------------------------------------------------
!  Exactly one of these forwards per MST instance and the other is
!  Alternate/blocking. They get LOOP GUARD: if BPDUs ever stop arriving
!  on a blocking port, loop guard keeps it blocked instead of letting it
!  time out and forward into a loop.
interface Ethernet0/1
 description ## to SW2 E0/3 -- trunk, uplink, LOOP GUARD ##
 no shutdown
!
interface Ethernet0/2
 description ## to SW3 E0/3 -- trunk, uplink, LOOP GUARD ##
 no shutdown
!
! ---- Access ports ---------------------------------------------------
interface Ethernet0/3
 description ## to host-a -- access VLAN 10, portfast + bpduguard ##
 no shutdown
!
interface Ethernet1/0
 description ## to host-c -- access VLAN 20, portfast + bpduguard ##
 no shutdown
!
end
