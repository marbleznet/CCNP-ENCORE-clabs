! =====================================================================
!  SW3  |  Distribution -- will become the MSTI2 ROOT
!
!  Minimal config only: hostname + interface descriptions.
!  NO VLANs, NO trunks, NO spanning-tree tuning, NO guards.
!  Every port boots as a DEFAULT ACCESS PORT IN VLAN 1.
!  You build all of it yourself -- see README.md.
!
!  SW3 roots MSTI2 (VLAN 20) while SW1 roots MSTI1 (VLAN 10). That split
!  is what makes SW4 reach the two VLANs over two DIFFERENT uplinks.
! =====================================================================
hostname sw3
!
no ip domain-lookup
!
! ---- Distribution triangle ------------------------------------------
interface Ethernet0/1
 description ## to SW1 E0/2 -- trunk, distribution triangle ##
 no shutdown
!
interface Ethernet0/2
 description ## to SW2 E0/2 -- trunk, distribution triangle ##
 no shutdown
!
! ---- Downlink to the access switch ----------------------------------
!  Faces away from the root -> ROOT GUARD, same as SW2 E0/3.
interface Ethernet0/3
 description ## to SW4 E0/2 -- trunk, downlink, ROOT GUARD ##
 no shutdown
!
end
