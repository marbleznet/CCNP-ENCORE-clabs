# =============================================================================
#  CCNP ENCORE — 802.1Q Trunking & EtherChannel Study Lab
# =============================================================================
#
#  Purpose: practice Layer 2 trunking and link aggregation on Cisco IOL from a
#  clean slate. The startup configs apply ONLY hostnames and interface
#  descriptions -- there are NO VLANs, NO trunks, NO EtherChannels, NO
#  spanning-tree tuning. Every switchport boots as a default access port in
#  VLAN 1. You build every concept by hand. See README.md.
#
#  Blueprint: 3.1.a (static + dynamic 802.1Q trunking)
#             3.1.b (static + dynamic EtherChannels)
#
#  Topology
#  --------
#          host-a                      host-b        host-c
#       10.10.10.11/24              10.10.10.12/24  10.10.20.13/24
#          VLAN 10                     VLAN 10        VLAN 20
#             |                            |            |
#          E1/0                         E1/0         E1/1
#        +-------+                       +-------+
#        |  SW2  |                       |  SW3  |
#        +-------+                       +-------+
#         E0/1-3                          E0/1-3
#            \\\                           ///
#             \\\  3 links -> Po1     3 links -> Po2  ///
#              \\\    (LACP)             (PAgP)      ///
#               \\\                                 ///
#              E0/1-3                            E1/0-2
#                    +---------------------------+
#                    |            SW1            |
#                    |      (distribution)       |
#                    +---------------------------+
#
#  THREE parallel links per switch pair, on purpose. Before you bundle them,
#  spanning-tree blocks two of the three -- which is exactly the problem
#  EtherChannel exists to solve, and the motivation for Lab 4. The two pairs
#  use DIFFERENT negotiation protocols (LACP vs PAgP) so you can contrast them
#  side by side in one topology.
#
#  There is deliberately NO link between SW2 and SW3: the L2 topology is a
#  loop-free tree (SW2 - SW1 - SW3) once the bundles are up, so any blocked
#  port you see is a real symptom, not background noise. Spanning tree itself
#  is the NEXT lab (../stp/).
#
#  Interface map (containerlab ethX -> IOL EthernetY/Z, E0/0 = mgmt):
#    eth1 -> Ethernet0/1    eth4 -> Ethernet1/0
#    eth2 -> Ethernet0/2    eth5 -> Ethernet1/1
#    eth3 -> Ethernet0/3    eth6 -> Ethernet1/2
# =============================================================================
name: l2-trunk-lab

topology:
  nodes:
    # ---- Distribution switch: aggregates both access switches ----
    sw1:
      kind: cisco_iol
      type: l2
      image: vrnetlab/cisco_iol:L2-17.16.01
      labels:
        topoViewer-role: switch
      startup-config: configs/sw1.partial.cfg

    # ---- Access switch 1: LACP bundle to SW1, hosts VLAN 10 ----
    sw2:
      kind: cisco_iol
      type: l2
      image: vrnetlab/cisco_iol:L2-17.16.01
      labels:
        topoViewer-role: switch
      startup-config: configs/sw2.partial.cfg

    # ---- Access switch 2: PAgP bundle to SW1, hosts VLAN 10 + VLAN 20 ----
    sw3:
      kind: cisco_iol
      type: l2
      image: vrnetlab/cisco_iol:L2-17.16.01
      labels:
        topoViewer-role: switch
      startup-config: configs/sw3.partial.cfg

    # ---- End hosts. Plain Linux containers on ACCESS ports (untagged). ----
    #      They exist to prove VLAN membership and trunk forwarding with ping,
    #      which is the only test that cannot be faked by a healthy-looking
    #      `show` command.
    host-a:                               # VLAN 10, behind SW2
      kind: linux
      image: wbitt/network-multitool
      labels:
        topoViewer-role: server
      exec:
        - ip addr add 10.10.10.11/24 dev eth1
        - ip link set eth1 up

    host-b:                               # VLAN 10, behind SW3 (same subnet as host-a)
      kind: linux
      image: wbitt/network-multitool
      labels:
        topoViewer-role: server
      exec:
        - ip addr add 10.10.10.12/24 dev eth1
        - ip link set eth1 up

    host-c:                               # VLAN 20, behind SW3 (different subnet)
      kind: linux
      image: wbitt/network-multitool
      labels:
        topoViewer-role: server
      exec:
        - ip addr add 10.10.20.13/24 dev eth1
        - ip link set eth1 up

  links:
    # ---- SW1 <-> SW2 : three parallel links, become Po1 (LACP) in Lab 4 ----
    - endpoints: ["sw1:eth1", "sw2:eth1"]
    - endpoints: ["sw1:eth2", "sw2:eth2"]
    - endpoints: ["sw1:eth3", "sw2:eth3"]

    # ---- SW1 <-> SW3 : three parallel links, become Po2 (PAgP) in Lab 5 ----
    - endpoints: ["sw1:eth4", "sw3:eth1"]
    - endpoints: ["sw1:eth5", "sw3:eth2"]
    - endpoints: ["sw1:eth6", "sw3:eth3"]

    # ---- Access ports to the end hosts ----
    - endpoints: ["sw2:eth4", "host-a:eth1"]
    - endpoints: ["sw3:eth4", "host-b:eth1"]
    - endpoints: ["sw3:eth5", "host-c:eth1"]
