! =====================================================================
!  SW2 — known-good baseline: access switch, LACP bundle to SW1
!  Pasted ON TOP of the startup config (hostname/descriptions present).
!
!  End state: Po1 (LACP PASSIVE) trunked to SW1, host-a in VLAN 10.
!  Passive on purpose: passive only ANSWERS, it never asks. The bundle
!  exists because SW1 is active. Passive on BOTH ends is a fault.
! =====================================================================
!
! ---- VLAN database ---------------------------------------------------
!  All three VLANs are defined on every switch even though SW2 has no
!  VLAN 20 port. A VLAN missing from the local database is not carried
!  over the trunk, so an incomplete database looks exactly like a
!  pruning problem.
vtp mode transparent
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name NATIVE-UNUSED
exit
!
! ---- Po1 members -> SW1 (LACP passive) -------------------------------
interface range Ethernet0/1 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 channel-protocol lacp
 channel-group 1 mode passive
exit
!
interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
exit
!
! ---- Access port to host-a ------------------------------------------
!  host-a sends untagged frames; the access VLAN is what tags them
!  internally. portfast because an end host cannot create a loop --
!  it skips listening/learning so the host gets link immediately.
interface Ethernet1/0
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
exit
!
port-channel load-balance src-dst-ip
!
end
