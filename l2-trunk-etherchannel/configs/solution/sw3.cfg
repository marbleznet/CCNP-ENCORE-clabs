! =====================================================================
!  SW3 — known-good baseline: access switch, PAgP bundle to SW1
!  Pasted ON TOP of the startup config (hostname/descriptions present).
!
!  End state: Po2 (PAgP AUTO) trunked to SW1, host-b in VLAN 10,
!  host-c in VLAN 20.
!  Auto is PAgP's passive equivalent: it answers but never initiates.
!  The bundle exists because SW1 is desirable. Auto/auto is a fault.
! =====================================================================
!
vtp mode transparent
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name NATIVE-UNUSED
exit
!
! ---- Po2 members -> SW1 (PAgP auto) ----------------------------------
interface range Ethernet0/1 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 channel-protocol pagp
 channel-group 2 mode auto
exit
!
interface Port-channel2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
exit
!
! ---- Access port to host-b: VLAN 10 ---------------------------------
!  Same VLAN and subnet as host-a, but a different switch. A successful
!  host-a -> host-b ping is the single test that proves the trunk and
!  the bundle are genuinely carrying VLAN 10 end to end.
interface Ethernet1/0
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
exit
!
! ---- Access port to host-c: VLAN 20 ---------------------------------
!  Deliberately unreachable from VLAN 10. There is no router and no SVI
!  anywhere in this lab, so VLAN 20 is an island. host-c failing to ping
!  host-a is the CORRECT result and your proof of segmentation.
interface Ethernet1/1
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
exit
!
port-channel load-balance src-dst-ip
!
end
