! =====================================================================
!  SW1 — known-good baseline: distribution switch
!  Pasted ON TOP of the startup config (hostname/descriptions present).
!
!  End state: two trunked EtherChannels, one per access switch.
!    Po1 -> SW2, LACP, SW1 is the ACTIVE end
!    Po2 -> SW3, PAgP, SW1 is the DESIRABLE end
! =====================================================================
!
! ---- VLAN database ---------------------------------------------------
!  VTP transparent: this switch stores VLANs locally and never learns
!  or teaches them. Every switch in this lab defines the same three
!  VLANs by hand, which is what you want when a stray VTP server can
!  otherwise wipe a VLAN database domain-wide.
vtp mode transparent
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name NATIVE-UNUSED
exit
!
! ---- Po1 members -> SW2 (LACP) ---------------------------------------
!  Configure the PHYSICAL ports first, identically, and add
!  channel-group last. The Port-channel inherits its config from the
!  first member to join, so members that disagree never bundle.
interface range Ethernet0/1 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 channel-protocol lacp
 channel-group 1 mode active
exit
!
! ---- Po2 members -> SW3 (PAgP) ---------------------------------------
interface range Ethernet1/0 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 channel-protocol pagp
 channel-group 2 mode desirable
exit
!
! ---- The logical interfaces -----------------------------------------
!  Restated explicitly. From here on the Port-channel is the interface
!  you configure; changes made to a member alone are what break bundles.
interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
exit
interface Port-channel2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
exit
!
! ---- Hashing --------------------------------------------------------
!  Which member a frame uses is decided by a HASH, not by load. With
!  src-dst-ip a single host pair always pins to one link -- the reason
!  "my EtherChannel is unbalanced" is usually not a fault at all.
port-channel load-balance src-dst-ip
!
end
