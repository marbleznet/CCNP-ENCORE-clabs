! =====================================================================
!  SW1  |  Distribution switch -- aggregates SW2 and SW3
!
!  Minimal config only: hostname + interface descriptions.
!  NO VLANs, NO trunks, NO EtherChannel, NO spanning-tree tuning.
!  Every port below boots as a DEFAULT ACCESS PORT IN VLAN 1.
!  You build all of it yourself -- see README.md.
! =====================================================================
hostname sw1
!
no ip domain-lookup
!
! ---- To SW2: three parallel links ----------------------------------
!  You will trunk these (Lab 2/3) and then bundle all three into
!  Port-channel1 using LACP (Lab 4) -- sw1 is the 'active' end.
!  Until they are bundled, spanning-tree blocks two of the three.
interface Ethernet0/1
 description ## to SW2 E0/1 -- future Po1 member (LACP active) ##
 no shutdown
!
interface Ethernet0/2
 description ## to SW2 E0/2 -- future Po1 member (LACP active) ##
 no shutdown
!
interface Ethernet0/3
 description ## to SW2 E0/3 -- future Po1 member (LACP active) ##
 no shutdown
!
! ---- To SW3: three parallel links ----------------------------------
!  Same idea, but bundled with PAgP into Port-channel2 (Lab 5) --
!  sw1 is the 'desirable' end. Two protocols, one topology, so you can
!  compare them without rebuilding anything.
interface Ethernet1/0
 description ## to SW3 E0/1 -- future Po2 member (PAgP desirable) ##
 no shutdown
!
interface Ethernet1/1
 description ## to SW3 E0/2 -- future Po2 member (PAgP desirable) ##
 no shutdown
!
interface Ethernet1/2
 description ## to SW3 E0/3 -- future Po2 member (PAgP desirable) ##
 no shutdown
!
end
