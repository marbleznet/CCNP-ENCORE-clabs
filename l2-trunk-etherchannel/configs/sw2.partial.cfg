! =====================================================================
!  SW2  |  Access switch -- LACP bundle to SW1, hosts VLAN 10
!
!  Minimal config only: hostname + interface descriptions.
!  NO VLANs, NO trunks, NO EtherChannel, NO spanning-tree tuning.
!  Every port below boots as a DEFAULT ACCESS PORT IN VLAN 1.
!  You build all of it yourself -- see README.md.
! =====================================================================
hostname sw2
!
no ip domain-lookup
!
! ---- To SW1: three parallel links ----------------------------------
!  You will trunk these (Lab 2/3) and then bundle all three into
!  Port-channel1 using LACP (Lab 4) -- sw2 is the 'passive' end, so the
!  bundle only forms because SW1 actively asks for it.
interface Ethernet0/1
 description ## to SW1 E0/1 -- future Po1 member (LACP passive) ##
 no shutdown
!
interface Ethernet0/2
 description ## to SW1 E0/2 -- future Po1 member (LACP passive) ##
 no shutdown
!
interface Ethernet0/3
 description ## to SW1 E0/3 -- future Po1 member (LACP passive) ##
 no shutdown
!
! ---- Access port to host-a -----------------------------------------
!  You will make this an access port in VLAN 10 (10.10.10.11/24).
!  host-a is untagged -- it knows nothing about VLANs.
interface Ethernet1/0
 description ## to host-a -- future access port, VLAN 10 ##
 no shutdown
!
end
