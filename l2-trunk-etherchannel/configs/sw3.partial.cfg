! =====================================================================
!  SW3  |  Access switch -- PAgP bundle to SW1, hosts VLAN 10 + VLAN 20
!
!  Minimal config only: hostname + interface descriptions.
!  NO VLANs, NO trunks, NO EtherChannel, NO spanning-tree tuning.
!  Every port below boots as a DEFAULT ACCESS PORT IN VLAN 1.
!  You build all of it yourself -- see README.md.
! =====================================================================
hostname sw3
!
no ip domain-lookup
!
! ---- To SW1: three parallel links ----------------------------------
!  You will trunk these (Lab 2/3) and then bundle all three into
!  Port-channel2 using PAgP (Lab 5) -- sw3 is the 'auto' end, so the
!  bundle only forms because SW1 is 'desirable'.
interface Ethernet0/1
 description ## to SW1 E1/0 -- future Po2 member (PAgP auto) ##
 no shutdown
!
interface Ethernet0/2
 description ## to SW1 E1/1 -- future Po2 member (PAgP auto) ##
 no shutdown
!
interface Ethernet0/3
 description ## to SW1 E1/2 -- future Po2 member (PAgP auto) ##
 no shutdown
!
! ---- Access ports to the hosts -------------------------------------
!  host-b lands in VLAN 10 -- same subnet as host-a on SW2, so pinging
!  it proves the trunk actually carries VLAN 10 between switches.
interface Ethernet1/0
 description ## to host-b -- future access port, VLAN 10 ##
 no shutdown
!
!  host-c lands in VLAN 20 -- a different subnet with no router
!  anywhere, so it must NOT be able to reach the VLAN 10 hosts. That
!  failure is a feature: it is how you prove the VLANs are separate.
interface Ethernet1/1
 description ## to host-c -- future access port, VLAN 20 ##
 no shutdown
!
end
